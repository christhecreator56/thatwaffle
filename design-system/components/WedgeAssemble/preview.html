<!-- @dsCard group="Signature" height=640 subtitle="The signature move: four logo wedges fly in and become one waffle." -->
<style>
.wa{position:relative;height:540px;overflow:hidden;background:var(--umber)}
.wa .sea{position:absolute;inset:auto 0 0;height:150px;background:url("{{Illustrations/pattern-seigaiha.svg}}") 0 0/120px 60px;opacity:.16}
.wa .w{position:absolute;left:50%;top:50%;width:380px;margin-left:-191px;margin-top:-244px;transform-origin:50.3% 98.6%;will-change:transform}
.wa .w img{width:100%}
.wa .cap{position:absolute;left:28px;bottom:22px;color:var(--justright)}
.wa .dash{position:absolute;height:12px;border-radius:9px;background:var(--justright);opacity:0}
</style>
<div class="wa" id="wa">
  <div class="sea"></div>
  <span class="dash" style="left:40px;top:150px;width:120px"></span><span class="dash" style="left:80px;top:178px;width:90px"></span>
  <span class="dash" style="right:40px;top:380px;width:120px"></span><span class="dash" style="right:80px;top:408px;width:90px"></span>
  <div class="w"><img src="{{Logos/wedge-900.webp}}" alt=""></div>
  <div class="w"><img src="{{Logos/wedge-900.webp}}" alt=""></div>
  <div class="w"><img src="{{Logos/wedge-900.webp}}" alt=""></div>
  <div class="w"><img src="{{Logos/wedge-900.webp}}" alt=""></div>
  <div class="cap"><div class="twp-label" id="lbl">1 of 4 is never enough</div></div>
</div>
<div class="twp-scrub"><button type="button" id="play">Replay</button><input id="r" type="range" min="0" max="1000" value="0" aria-label="Scroll position"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
var ws=gsap.utils.toArray('#wa .w'),dashes=gsap.utils.toArray('#wa .dash'),lbl=document.getElementById('lbl');
var from=[{x:-640,y:-180,r:-60},{x:660,y:-260,r:190},{x:620,y:320,r:330},{x:-600,y:340,r:120}],end=[0,90,180,270];
ws.forEach(function(el,i){gsap.set(el,{x:from[i].x,y:from[i].y,rotation:from[i].r,scale:1.25});});
gsap.set(ws[0],{x:0,y:40,rotation:0,scale:1});
var tl=gsap.timeline();
tl.to(ws[0],{y:0,duration:.5,ease:'sine.out'},0);
tl.to(dashes,{opacity:1,duration:.15,stagger:.04},.25).to(dashes,{x:function(i){return i<2?60:-60},opacity:0,duration:.5,stagger:.04},.6);
[1,2,3].forEach(function(i,n){
  tl.to(ws[i],{x:0,y:0,rotation:end[i],scale:1,duration:.75,ease:'back.out(1.5)'},.5+n*.42);
  tl.to(ws.slice(0,i),{rotation:'+=0',scale:1.02,duration:.06,yoyo:true,repeat:1},.5+n*.42+.42);
  tl.call(function(){},null,.5+n*.42);
});
tl.to(ws,{rotation:'+=90',duration:.9,ease:'power2.inOut'},2.1);
tl.to('#wa .sea',{y:-24,opacity:.3,duration:1.2,ease:'none'},1.6);
var txt=['1 of 4 is never enough','2 of 4, getting warmer','3 of 4, nearly there','That whole waffle'];
tl.eventCallback('onUpdate',null);
TWP.scrubber(tl,document.getElementById('r'),document.getElementById('play'));
var sync=tl.eventCallback('onUpdate');
tl.eventCallback('onUpdate',function(){sync&&sync();var p=tl.time();lbl.textContent=txt[p<.9?0:p<1.3?1:p<1.75?2:3];});
</script>
