<!-- @dsCard group="Imagery" height=420 subtitle="Four ways a photo may appear. Nothing else." -->
<style>
.fr{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:24px;background:var(--umber);color:var(--justright)}
.fr figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.fr .box{height:250px;display:grid;place-items:center;min-width:0}
.fr figcaption{font-size:14px;line-height:20px}
.fr b{display:block;font-family:var(--font-poster);font-weight:400;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.fr .sticker img{width:100%;transform:rotate(-5deg);filter:drop-shadow(0 18px 14px rgba(46,44,37,.45))}
.fr .scallop{width:100%;height:100%;object-fit:cover;object-position:42% 50%;-webkit-mask:url("{{Illustrations/mask-scallop.svg}}") center/contain no-repeat;mask:url("{{Illustrations/mask-scallop.svg}}") center/contain no-repeat}
.fr .wedge{width:172px;height:172px;object-fit:cover;object-position:50% 70%;border-radius:100% 0 0 0;transform:rotate(45deg);border:5px solid var(--justright)}
.fr .wedge-wrap{align-content:start;padding-top:58px}
.fr .bleed{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-lg)}
</style>
<div class="fr">
  <figure><div class="box sticker"><img src="{{Logos/wedge-900.webp}}" alt="Logo waffle wedge illustration"></div><figcaption><b>Illustration</b>Hero only. The logo wedge, four make the whole waffle.</figcaption></figure>
  <figure><div class="box"><img class="scallop" src="{{Photos/photo-red-velvet.webp}}" alt="Red velvet waffle in a scalloped window"></div><figcaption><b>Scallop window</b>Bright plated shots. Echoes the badge.</figcaption></figure>
  <figure><div class="box wedge-wrap"><img class="wedge" src="{{Photos/photo-crunch-dark.webp}}" alt="Chocolate crunch waffle in a wedge window"></div><figcaption><b>Wedge window</b>Close crops. The same quarter as the logo.</figcaption></figure>
  <figure><div class="box"><img class="bleed" src="{{Photos/photo-drip-stack.webp}}" alt="Dipped waffle stack on a dark table"></div><figcaption><b>Moody full-bleed</b>Dark set shots, used large and alone.</figcaption></figure>
</div>
