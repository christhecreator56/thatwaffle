<!-- @dsCard group="Pages" width=1280 height=800 subtitle="Everything at once: the first screen of the site." -->
<style>
.hb{position:relative;height:720px;overflow:hidden;background:var(--umber);isolation:isolate}
.hb .sea{position:absolute;right:-20px;bottom:0;width:640px;height:300px;background:url("{{Illustrations/pattern-seigaiha.svg}}") 0 0/120px 60px;opacity:.13}
.hb nav{position:absolute;z-index:6;left:36px;right:36px;top:20px;display:flex;align-items:center;justify-content:space-between}
.hb nav img{height:74px;width:auto}
.hb nav ul{display:flex;gap:28px;margin:0;padding:0;list-style:none;color:var(--justright)}
.hb .t1,.hb .t2{position:absolute;z-index:3}
.hb .t1{left:44px;top:92px;font-size:164px}
.hb .t2{left:128px;top:226px;font-size:164px}
.hb .sub{position:absolute;z-index:3;left:60px;top:392px;width:470px;color:var(--justright)}
.hb .sub p{margin:0 0 20px;font-family:var(--font-poster);font-weight:400;font-size:38px;line-height:1.04;letter-spacing:.03em;text-transform:uppercase}
.hb .badge{position:absolute;z-index:6;right:36px;top:84px;width:196px}
.hb .seal{position:absolute;z-index:6;left:14px;top:392px;width:34px}
.hb .ribbon{position:absolute;z-index:2;left:-40px;right:-40px;bottom:36px}
.hb .ribbon svg{display:block;width:100%}
.hb .ribbon text{font-family:Ranchers,"Potta One",sans-serif;font-size:38px;letter-spacing:.06em;fill:var(--umber)}
.hb .drip{position:absolute;z-index:7;left:0;right:0;bottom:0;height:90px;transform:translateY(0)}
.hb .drip svg{display:block;width:100%;height:100%;transform:scaleY(-1)}
.hb .bar{display:flex;gap:18px;flex-wrap:wrap}
.hb .wf{--w:430px;position:absolute;z-index:4;right:70px;bottom:-14px;width:560px;height:560px}
.hb .wf div{position:absolute;left:50%;top:50%;width:var(--w);margin-left:calc(var(--w)*-.503);margin-top:calc(var(--w)*-.643);transform-origin:50.3% 98.6%}
.hb .wf img{width:100%}
</style>
<div class="hb" id="hb">
  <div class="sea"></div>
  <nav><img src="{{Logos/logo-full-trace-cream.svg}}" alt="That Waffle Place!"><ul class="twp-label"><li>Menu</li><li>Offers</li><li>Find us</li></ul></nav>
  <span class="sticker-type t1" data-t="that crunch.">that crunch.</span>
  <span class="sticker-type t2" data-t="that melt.">that melt.</span>
  <div class="sub"><p>Waffles cut in quarters, stuffed and dipped</p><div class="bar"><a class="twp-btn" href="#order">Order on WhatsApp</a></div></div>
  <div class="wf" role="img" aria-label="Illustration of a whole waffle"><div><img src="{{Logos/wedge-900.webp}}" alt=""></div><div style="transform:rotate(90deg)"><img src="{{Logos/wedge-900.webp}}" alt=""></div><div style="transform:rotate(180deg)"><img src="{{Logos/wedge-900.webp}}" alt=""></div><div style="transform:rotate(270deg)"><img src="{{Logos/wedge-900.webp}}" alt=""></div></div>
  <img class="badge" src="{{Badges/badge-waffle.svg}}" alt="That Waffle Place! badge">
  <img class="seal" src="{{Badges/hanko-waffuru.svg}}" alt="ワッフル">
  <div class="ribbon"><svg viewBox="0 0 1360 170" aria-hidden="true"><defs><path id="rb" d="M-60 120C200 40 420 30 680 90 940 150 1140 130 1420 40"/></defs><use href="#rb" fill="none" stroke="#ad795a" stroke-width="60" transform="translate(0 9)"/><use href="#rb" fill="none" stroke="#eed4bc" stroke-width="56"/><text dy="11"><textPath href="#rb" id="tp"></textPath></text></svg></div>
  <div class="drip"><svg viewBox="0 0 1280 90" preserveAspectRatio="none" aria-hidden="true"><path id="dp" fill="#2e2c25"></path></svg></div>
</div>
<div class="twp-scrub"><button type="button" id="play">Replay intro</button><input id="r" type="range" min="0" max="1000" value="1000" aria-label="Intro progress"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
var tp=document.getElementById('tp');tp.textContent=new Array(11).join('THAT WAFFLE PLACE!  ●  ワッフル  ●  ');
var dp=document.getElementById('dp'),st={p:1};function dd(){dp.setAttribute('d',TWP.dripPath(1280,90,{p:st.p,n:13,seed:5,base:.25}));}dd();
var off={v:0};
var tl=gsap.timeline();
tl.from('#hb .t1',{scale:1.5,rotation:-6,opacity:0,duration:.32,ease:'back.out(2.6)'},.1);
tl.from('#hb .t2',{scale:1.5,rotation:5,opacity:0,duration:.32,ease:'back.out(2.6)'},.26);
tl.from('#hb .sub',{y:30,opacity:0,duration:.34,ease:'power2.out'},.74);
tl.from('#hb .badge',{scale:1.9,rotation:-30,opacity:0,duration:.28,ease:'power4.in'},.95);
tl.from('#hb .seal',{scale:1.5,opacity:0,duration:.2,ease:'power4.in'},1.1);
tl.from('#hb .wf',{rotation:-90,scale:.6,opacity:0,duration:.7,ease:'back.out(1.5)'},.4);
tl.from('#hb .ribbon',{yPercent:70,opacity:0,duration:.5,ease:'power3.out'},1);
tl.fromTo(st,{p:0},{p:1,duration:.9,ease:'none',onUpdate:dd},1);
TWP.scrubber(tl,document.getElementById('r'),document.getElementById('play'));
if(!TWP.calm){(function loop(){off.v-=.5;tp.setAttribute('startOffset',off.v%520);requestAnimationFrame(loop);})();}
</script>
